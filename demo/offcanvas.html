<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>抽屉</title>
    <link rel="stylesheet" href="../css/index.css">
    <style>
        header {
            display: flex;
            height: 6rem;
            justify-content: space-between;
            background-color: antiquewhite;
        }
    </style>
</head>
<body>
    <header>
        <a href="../index.html" class="nav-tool hamburger flex-center aspect-square">
            <span class="iconfont icon-left"></span>
        </a>

        <!-- 打开 -->
        <div class="nav-tool hamburger flex-center aspect-square">
            <span class="iconfont icon-menu"
                data-action="open"
                data-target="drawer">
            </span>
        </div>
    </header>

<!-- mask -->
<div class="leo-mask fixed-fullscreen" data-ui-mask></div>

<div class="container">

    <!-- offcanvas 实体 -->
    <div class="offcanvas fixed-fullscreen"
         data-ui="offcanvas"
         id="drawer">

        <div class="popup-top">
            <span class="iconfont icon-close aspect-square flex-center hamburger"
                  data-action="close"
                  data-target="drawer">
            </span>
        </div>
        <div class="popup-content">内容</div>

    </div>
</div>
    <script type="module" src="../js/index.js"></script>
</body>
</html>
