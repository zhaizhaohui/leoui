<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tab</title>
    <link rel="stylesheet" href="../css/index.css">
    <style>
        header {
            display: flex;
            height: 6rem;
            justify-content: space-between;
            background-color: antiquewhite;
            margin-bottom: 4rem;
        }
    </style>
</head>
<body>
    <header>
        <a href="../index.html" class="nav-tool hamburger flex-center aspect-square">
            <span class="iconfont icon-left"></span>
        </a>
    </header>
    <div class="container">
        <div data-ui="tabs">
            <div data-ui-item>
                <div data-ui-role="trigger" class="tab-bar">Tab1</div>

                <div data-ui-role="panel">
                    <div class="tab-content">内容1</div>
                </div>
            </div>

            <div data-ui-item>
                <div data-ui-role="trigger" class="tab-bar">Tab2</div>

                <div data-ui-role="panel">
                    <div class="tab-content">内容2</div>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="../js/index.js"></script>
</body>
</html>
